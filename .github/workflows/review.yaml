name: AI Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "レビュー対象の Pull Request 番号"
        required: true
        type: number

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          pr_number: ${{ inputs.pr_number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_api_base_url: ${{ secrets.LLM_API_BASE_URL }}
          llm_api_key: ${{ secrets.LLM_API_KEY }}
          review_model: ${{ vars.REVIEW_MODEL || 'preview/Kimi-K2.6' }}
          review_system_prompt: ${{ vars.REVIEW_SYSTEM_PROMPT }}
