[project]
name = "github-review-app"
version = "0.2.0"
description = "OpenAI 互換 API を使って GitHub Pull Request を自動レビューするツール"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.38.0",
    "requests>=2.34.2",
]

[project.scripts]
github-review = "github_review_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_review_app"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.20",
    "ty>=0.0.55",
]

[tool.ruff]
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
